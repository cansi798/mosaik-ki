[package]
name = "mosaik-ki"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Lokale KI (Gemma 4 über llama.cpp) für die Mosaik-Apps"
repository = "https://github.com/cansi798/mosaik-ki"

[features]
default = []
egui = ["dep:egui"]
# Herunterladen und Einrichten der KI (llama-server und Gemma) direkt aus den Apps.
install = [
    "dep:ureq",
    "dep:sha2",
    "dep:zip",
    "dep:flate2",
    "dep:tar",
    "dep:sysinfo",
    "dep:fs4",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
egui = { version = "0.36", optional = true, default-features = false }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
sha2 = { version = "0.11.1", optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"], optional = true }
flate2 = { version = "1.1.10", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"], optional = true }
fs4 = { version = "1.1.0", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
