[package]
name = "mosaik-ki"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Lokale KI (Gemma 4 über llama.cpp) für die Mosaik-Apps"
repository = "https://github.com/cansi798/mosaik-ki"

[features]
default = []
egui = ["dep:egui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
egui = { version = "0.36", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
